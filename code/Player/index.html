<script>
  const drawerCont = document.querySelector("#drawer-container");
  const backdrop = document.querySelector("#backdrop");

  const PEEK_Y = 120;
  const FULL_Y = window.innerHeight;
  
  /*window.addEventListener("DOMContentLoaded", () => {
    drawerCont.scrollTop = PEEK_Y;
  })*/
  
  drawerCont.addEventListener("scroll", () => {
    const scrollTop = drawerCont.scrollTop;
    
    if(scrollTop >= FULL_Y - 100) {
      backdrop.style.pointerEvents = "auto";
    } else {
      backdrop.style.pointerEvents = "none";
    }
    
    const fullProgress = Math.max(0, (scrollTop - PEEK_Y) / (FULL_Y - PEEK_Y));
    backdrop.style.background = `rgba(0,0,0,${fullProgress * 0.5}`;
    /*
    if(Math.abs(scrollTop - PEEK_Y) < 50) {
      document.querySelector("#drawer-sheet").classList.add("peek");
    } else {
      document.querySelector("#drawer-sheet").classList.remove("peek");
    }*/
    
    
    const f = Math.max(0, Math.min(1, fullProgress));
    const sheetImg = document.querySelector("#drawer-sheet img");
    const sheetMusicName = document.querySelector("#drawer-sheet .music-name");
    //sheetImg.style.transform = `scale(${0.7 * f + 0.3}) translateX(${120 * f - 120}px) translateY(${120 * f - 120}px)`;
    sheetImg.style.opacity = f;
    sheetMusicName.style.transform = `translateX(${80*(1-f)}px) scale(${1 - 0.2 * (1-f)})`;
    
    
  })
  
  backdrop.addEventListener('click', () => {
    drawerCont.scrollTo({ top: PEEK_Y, behavior: 'smooth' });
  });
  
</script>

  // 1. Assets and Player classes
  class Assets {
  
  constructor() {
    this.assets = new Map();
  }

  async load(data = []) {
    await Promise.all(data.map(async (params) => {
      const type = params.type;
      let asset;
      
      switch(type) {
        case "img": {
          asset = new Image();
          asset.src = params.url;
          await asset.decode();
          break;
        }
        case "audio": {
          asset = new Audio();
          asset.src = params.url;
          await new Promise((resolve, reject) => {
            asset.oncanplaythrough = resolve;
            asset.onerror = () => reject(new Error(`Failed to load audio: ${params.key}`));
          });
          break;
        }
        case "json": {
          const res = await fetch(params.url);
          if (!res.ok) throw new Error(`Failed to fetch JSON: ${params.key}`);
          asset = await res.json();
          break;
        }
        case "text": {
          const res = await fetch(params.url);
          if (!res.ok) throw new Error(`Failed to fetch TEXT: ${params.key}`);
          asset = await res.text();
          break;
        }
      }

      this.assets.set(params.key, asset);
    }));

    
    return this.assets;
  }

  get(key) {
    return this.assets.get(key);
  }
  
}
  class Music {
    constructor() {
      this.audio = new Audio();
    }
    async load(url) {
      this.audio.src = url;
      this.audio.preload = "auto";
      this.audio.load();
      await new Promise((res, rej) => {
        this.audio.oncanplay = res;
        this.audio.onerror = () => rej(new Error(`Failed to load music: ${url}`));
      })
    }
    destroy() {
      this.audio.pause();
      this.audio.src = "";
      this.audio.removeAttribute("src");
      this.audio.load();
    }
  }

      // .lrc file 
      let html = "";
      lrc = lrc.trim();
      if(lrc[0] === "[" && !isNaN(lrc[1])) {
        this.lyricsData = parseLrc(lrc);
      } else if(lrc[0] == "1") {
        const arr = lrc.split("\n");
        this.lyricsData = [];
        for(let idx = arr.length - 1; idx >= 0; idx -= 4) {
          let obj = {};
          obj.line = arr[idx].trim();
          obj.time = convertToSeconds(arr[idx - 1].split(" --> ")[0].replace(/,/, "."));
          this.lyricsData.push(obj);
        }
      } else {
        this.plainSubtitle = true;
        lrc.split("\n").forEach(line => {
          line.length === 0 ? html += `<br>` : html += `<p>${line}</p>`;
        })
        helloElm.classList.add("active");
        helloElm.innerHTML = html;
        return;
      }
      
      for(let idx = this.lyricsData.length - 1; idx >= 0; idx--) {
        const { line, time } = this.lyricsData[idx];
        html += `<p class="lyric-${idx}" time="${time}">${line}</p>`;
      }
      
      helloElm.innerHTML = html;
      //helloElm.addEventListener("click")
      
      //console.log(html)
      //console.log(data)
      
    }
    
    play() {
      this.currentPlaying.play();
      this._get(".playSvg").classList.remove("hide");
      this._get(".pauseSvg").classList.add("hide");
    }
    
    pause() {
      this.currentPlaying.pause();
      this._get(".playSvg").classList.add("hide");
      this._get(".pauseSvg").classList.remove("hide");
    }
    
  }

  // 2. Loading the resources
  const res = new Assets();
  const _my_data = [
    { key: "music_list", url: "res/data.json", type: "json" }
  ];
  await res.load(_my_data);
  
  // 3. DOM elements selection 
  const songListElm = document.querySelector("#songs-list-1");
  const playerElm = document.querySelector("#player-3");
  const sheetBgImg = document.querySelector("#bg-img");
  
  const defaultUrl = "https://d1csarkz8obe9u.cloudfront.net/posterpreviews/cold-night-album-cover-design-template-f4373773b6a4babb5a33af50b3f4725e_screen.jpg?ts=1698203459";
  
  // 4. Some utility and functionality functions
  function parseLrc(lrc) {
    lrc = lrc.replace(/\[/g, "");
    lrc = lrc.split("\n");
    const data = [];
    
    for(let idx = 0; idx < lrc.length; idx++) {
      if(lrc[idx].trim().length === 0) continue;
      let d = lrc[idx].split("]");
      data.push({
        time: convertToSeconds(d[0]),
        line: d[1].trim()
      });
    }
    
    return data.sort((a, b) => b.time - a.time);
  }
  
  function clamp(x, min, max) {
    return Math.max(0, Math.min(x, max));
  }
  // 324.56 (seconds) -> 05:24
  function formatTime(sec) {
    let s = sec % 60;
    let min = (sec - s) / 60;
    let m = min % 60;
    let h = (min - m) / 60;
    s = Math.floor(s);
    
    if(h > 0) return h.toString().padStart(2, "0") + ":" + m.toString().padStart(2, "0") + ":" + s.toString().padStart(2, "0");
    return m.toString().padStart(2, "0") + ":" + s.toString().padStart(2, "0");
  }
  // 05:24 -> 324 (seconds)
  function convertToSeconds(time) {
    let t = time.split(":");
    if(t.length > 2) return Number(t[0]) * 3600 + Number(t[1]) * 60 + Number(t[2]);
    return Number(t[0]) * 60 + Number(t[1]);
  }
  
  async function fetchCoverArt(query, high_res = true) {
    if (!query) return;

    try {
      const response = await fetch(
        `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=1`
      );

      if (!response.ok) {
        console.log(`Failed to fetch cover art: ${query}`);
        return defaultUrl;
      }
      
      const data = await response.json();
      if (data.results && data.results.length > 0) {
        const track = data.results[0];
        if(!high_res) return track.artworkUrl100;
        const highResArtUrl = track.artworkUrl100.replace('100x100bb', '600x600bb');
        //const releaseYear = track.releaseDate ? new Date(track.releaseDate).getFullYear() : '';
        
        return highResArtUrl;
        // track.trackName;
        // track.artistName;
        // track.collectionName
        // releaseYear
      } else {
        return defaultUrl;
      }
      
    } catch (err) {
        console.log(`Some error occured while trying to fetch cover art: ${query}. Error: ${err}`);
        return defaultUrl;
    }
  }
  
  
  function updateSongList(player) {
    player.filteredSongs = [];
    for(const [category, array] of Object.entries(player.songs)) {
      
      // filter here
      array.forEach(entry => {
        player.filteredSongs.push(entry);
      })
      
    }
    
    
    //player.currentSongIdx = 0;
    
    let html = "";
    player.filteredSongs.forEach((song, idx) => {
      
    
      html += `
        <div id="sl-${idx}" idx="${idx}">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSU4CHYG6s4piC0RFDg-YtOTSbwN0jrfu3C_cg3zUa9Lw&s=10" alt="cover" idx="${idx}">
           <div idx="${idx}">
             <p class="song-name gradient-text" idx="${idx}">${song.name}</p>
             <p class="song-artist gradient-text" idx="${idx}">${song.artist ? song.artist : ""}</p>
       </div>
      </div>`;
    })
    
    songListElm.innerHTML = html;
    
    let imgs = songListElm.querySelectorAll("img");
    player.filteredSongs.forEach((song, idx) => {
      if(!song.cover) {
        let q = song.artist ? (song.name+" "+song.artist) : song.name;
        fetchCoverArt(q).then(u => {
          song.cover = u;
          imgs[idx].src = u;
        })
      } else {
        imgs[idx].src = song.cover;
      }
    })
    
    
  }
  
  
  
  // 5. player creation 
  const myPlayer = new Player(playerElm, res.get("music_list"));
  updateSongList(myPlayer);
  console.log(myPlayer);
  
  
  
  //const main_audio = new Music();
  
  // 6. addEventListener to song list (and then play the selected song)
  
  songListElm.addEventListener("click", async function(e) {
    const song = myPlayer.filteredSongs[e.target.attributes.idx.value];
    const n = song.name;
    
    if(n === myPlayer.currentPlayingName) {
      drawerCont.scrollTo({
        top: PEEK_Y, behavior: "smooth"
      });
      return;
    }
    
    myPlayer.currentPlayingName = n;

    
    myPlayer.main_audio.destroy();
    await myPlayer.main_audio.load(song.url);
    
    if(song.lrc) {
      await res.load([{ key: n+"-lrc", url: song.lrc, type: "text" }]);
    }
    
    myPlayer._set(n, myPlayer.main_audio.audio, song.cover, res.get(n+"-lrc"));
    myPlayer.play();
    drawerCont.scrollTo({
      top: PEEK_Y, behavior: "smooth"
    });
    
    
    sheetBgImg.style.backgroundImage = `url("${song.cover}")`;
    
  })
  
  
  
  const searchBar = document.querySelector("#search-bar");
  searchBar.addEventListener("input", () => {
    
    if(searchBar.value.length !== 0) {
      songListElm.classList.add("searching");
    } else {
      songListElm.classList.remove("searching");
    }
    
    myPlayer.filteredSongs.forEach((song, idx) => {
      
      const artist = song.artist ? song.artist.toLowerCase() : "";
      
      if(song.name.toLowerCase().includes(searchBar.value.toLowerCase()) || artist.includes(searchBar.value.toLowerCase())) {
        //console.log(song.name)
        songListElm.querySelector("#sl-"+idx).classList.add("found");
      } else {
        songListElm.querySelector("#sl-"+idx).classList.remove("found");
      }
      
    })
    
  })
  
  const sheetImg = document.querySelector("#drawer-sheet img");
  sheetImg.addEventListener("dblclick", e => {
    if(e.clientX < window.innerWidth/2) {
      myPlayer.seekTo(-10);
    } else {
      myPlayer.seekTo(10);
    }
  })
  
</script>
