<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Himitsu v2</title>
  <style>
:root {
  --border-color: #cbd5e1;
}
* {
  margin: 0;
  padding: 0;
  color: #a3f2ff;
  box-sizing: border-box;
}
body {
  background: rgb(0,10,20);
  font-family: sans-serif;
}

.drop-zone {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 200px;
  border: 2px dashed rgba(143,219,255,0.2);
  border-radius: 12px;
  background: rgba(255,255,255,0.05);
  cursor: pointer;
  transition: border-color 0.2s ease, background-color 0.2s ease;
  text-align: center;
  -webkit-tap-highlight-color: rgba(0,0,0,0.3);
  user-select: none;
}


.drop-zone--dragover {
  border-color: rgb(89,241,253);
  background-color: #eef2ff05;
}


.drop-zone__input {
  display: none;
}

.drop-zone__prompt {
  color: #64748b;
}

.drop-zone__icon {
  font-size: 2.5rem;
  display: block;
  margin-bottom: 0.5rem;
}

.drop-zone__prompt strong {
  color: rgb(148,255,253);
}

.drop-zone__subtext {
  font-size: 0.85rem;
  color: rgb(92,202,255);
  display: block;
  margin-top: 0.25rem;
}


.file-list {
  margin-top: 1.5rem;
  list-style: none;
  padding: 0;
}

.file-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 1rem;
  background: rgb(4,9,26);
  border: 1px solid rgba(155,216,240,0.2);
  border-radius: 8px;
  margin-bottom: 0.5rem;
  font-size: 0.70rem;
}

#main-section {
  margin-bottom: 24px;
  width: 90vw;
  max-width: 960px;
  margin: auto;
  padding: 20px;
}

#main-section textarea {
  outline: none;
  background: rgba(255,255,255,0.03);
  border-radius: 8px;
  min-width: 100%;
  max-width: 100%;
  padding: 10px;
  font-family: serif;
  border: 2px solid rgba(45,60,64,0.25);
}
#main-section textarea::placeholder {
  color: rgb(209,244,253);
}
#main-section pre {
  white-space: pre-wrap;
  overflow-wrap: break-word;
  /*overflow-x: auto;*/
  font-family: Sans-Serif;
}
#main-section button {
  background: rgb(92,229,225);
  color: rgb(0,63,61);
  border: none;
  padding: 8px;
  border-radius: 10px;
  font-weight: 600;
  transition: 0.3s;
  user-select: none;
}
#main-section input {
  background: rgba(255,255,255,0.05);
  outline: none;
  border-radius: 8px;
  border: 2px solid rgba(45,60,64,0.25);
  padding: 10px;
  margin: 20px 0;
}
.button-cont {
  display: flex;
  gap: 10px;
  margin: 10px 0;
}
.button-cont button:nth-child(2) {
  background: rgb(70,255,195);
}
#main-section button:hover {
  background: rgb(14,178,207);
  transform: scale(1.1);
  color: rgb(212,242,255);
}
.button-cont button:nth-child(2):hover {
  background: rgb(13,153,123);
  color: rgb(212,254,255);
}
#space {
  width: 100%;
  height: 100vh;
  display: none;
}
#encrypted-data,
#salt {
  white-space: pre-wrap;
  overflow-wrap: break-word;
  overflow-x: auto;
  font-size: 10px;
}
  </style>
</head>
<body>

<section id="main-section">

<h2>Encrypt Text</h2>
<input type="password" placeholder="Create password" id="password">
<textarea name="encrypt-text" id="encrypt-text" cols="30" rows="10" placeholder="Paste or write your text here to encrypt..."></textarea>
<div class="button-cont">
  <button id="encrypt">Encrypt</button>
  <button id="download">Download</button>
</div>

<div>
  <p><strong>Encrypted data</strong><p id="encrypted-data"> ...</p></p>
  <p><strong>Salt</strong><p id="salt"> ...</p></p>
</div>



<h2 style="margin-top:50px;margin-bottom:10px;">Decrypt Text</h2>
<label class="drop-zone" id="dropZone">
  <div class="drop-zone__prompt">
    <span class="drop-zone__icon">📁</span>
    <p>Drag & Drop your files here or <strong>Browse</strong></p>
    <span class="drop-zone__subtext">Only Text files</span>
  </div>
  <input type="file" id="fileInput" class="drop-zone__input" accept="text/*">
</label>

<ul class="file-list" id="fileList"></ul>

<input type="password" id="decode-password" placeholder="Enter password">
<button id="decode-btn">Decode</button>
<div class="button-cont">
  <button id="raw-copy">RC</button>
  <button id="copy">C</button>
</div>
<pre id="decoded-text"></pre>

<div id="space"></div>

</section>
<script>

async function encrypt(txt, key) {

  const encoder = new TextEncoder();
  const buffer = encoder.encode(txt);

  const iv = window.crypto.getRandomValues(new Uint8Array(12));

  const encryptedBuffer = await window.crypto.subtle.encrypt(
    { name: "AES-GCM", iv },
    key,
    buffer
  );

  const combinedBuffer = new Uint8Array(
    iv.length + encryptedBuffer.byteLength
  );

  combinedBuffer.set(iv, 0);
  combinedBuffer.set(new Uint8Array(encryptedBuffer), iv.length);

  return combinedBuffer;
}
async function decrypt(combinedBuffer, key) {

  const decoder = new TextDecoder();

  const receivedBytes = new Uint8Array(combinedBuffer);

  const iv = receivedBytes.slice(0, 12);
  const ciphertext = receivedBytes.slice(12);

  const decryptedBuffer = await window.crypto.subtle.decrypt(
    { name: "AES-GCM", iv },
    key,
    ciphertext
  );

  return decoder.decode(decryptedBuffer);
}
async function generateKey(password, salt) {
  
  if(!salt) salt = crypto.getRandomValues(new Uint8Array(16));
  
  const encoder = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    "raw",
    encoder.encode(password),
    "PBKDF2",
    false,
    ["deriveKey"]
  );
  
  const key = await crypto.subtle.deriveKey(
    {
      name: "PBKDF2",
      salt: encoder.encode(salt),
      iterations: 600000,
      hash: "SHA-256"
    },
    keyMaterial,
    {
      name: "AES-GCM",
      length: 256
    },
    true,
    ["encrypt", "decrypt"]
  );
  
  
  return { key, salt };
  
}
async function exportKey(key) {
  const rawKey = await crypto.subtle.exportKey("raw", key);
  const bytes = new Uint8Array(rawKey);

  let binary = "";
  for (const byte of bytes) {
    binary += String.fromCharCode(byte);
  }
  
  return btoa(binary);
}
async function importKey(base64) {
  const binary = atob(base64);

  const bytes = Uint8Array.from(
    binary,
    char => char.charCodeAt(0)
  );

  return await crypto.subtle.importKey(
    "raw",
    bytes,
    { name: "AES-GCM" },
    true,
    ["encrypt", "decrypt"]
  );
}




const input = document.querySelector("#encrypt-text");
const submit = document.querySelector("#encrypt");
const passwordElm = document.querySelector("#password");
const encryptedDataElm = document.querySelector("#encrypted-data");
const saltElm = document.querySelector("#salt");

encryptedDataElm.addEventListener("dblclick", () => {
  copyTextToClipboard(encryptedDataElm.textContent);
})
saltElm.addEventListener("dblclick", () => {
  copyTextToClipboard(saltElm.textContent);
})

let ENCRYPTED_DATA, SALT, HASH;

submit.addEventListener("click", async (e) => {
  
  const password = passwordElm.value;
  const { key, salt } = await generateKey(password);
  
  const encrypted = await encrypt(input.value, key);
  const base64 = await exportKey(key);
  
  ENCRYPTED_DATA = encrypted.toBase64();
  SALT = salt.toBase64();
  HASH = base64;
  
  encryptedDataElm.textContent = ENCRYPTED_DATA;
  saltElm.textContent = SALT;
  
  
  
})

const downloadBtn = document.querySelector("#download");
downloadBtn.addEventListener("click", () => {
  if(!SALT || !ENCRYPTED_DATA) return;
  const params = new URLSearchParams(window.location.search);
  const hash = params.get("hash");
  let text;
  
  if(hash === "0" || hash?.toLowerCase() === "false") {
    text = `{"data":"${ENCRYPTED_DATA}","salt":"${SALT}"}`;
  } else {
    text = `{"data":"${ENCRYPTED_DATA}","salt":"${SALT}","hash":"${HASH}"}`;
  }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  
  downloadBlob(blob, `Himitsu${getDateTime()}.txt`);
})

function getDateTime() {
  const d = new Date();

  const pad = n => String(n).padStart(2, '0');

  return (
    pad(d.getDate()) +
    pad(d.getMonth() + 1) +
    d.getFullYear() +
    pad(d.getHours()) +
    pad(d.getMinutes())
  );
}



function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileList = document.getElementById('fileList');

['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
  dropZone.addEventListener(eventName, e => e.preventDefault(), false);
});

['dragenter', 'dragover'].forEach(eventName => {
  dropZone.addEventListener(eventName, () => dropZone.classList.add('drop-zone--dragover'), false);
});

['dragleave', 'drop'].forEach(eventName => {
  dropZone.addEventListener(eventName, () => dropZone.classList.remove('drop-zone--dragover'), false);
});

dropZone.addEventListener('drop', (e) => {
  const droppedFiles = e.dataTransfer.files;
  
  if (droppedFiles.length > 0) {
    fileInput.files = droppedFiles; 
    updateFileList(droppedFiles);
  }
});

fileInput.addEventListener('change', () => {
  updateFileList(fileInput.files);
});

function updateFileList(files) {
  fileList.innerHTML = '';
  
  Array.from(files).forEach(file => {
    const li = document.createElement('li');
    li.className = 'file-item';
    
    const sizeInKB = (file.size / (1024)).toFixed(2);
    
    li.innerHTML = `
      <span><strong>${file.name}</strong> (${sizeInKB} KB)</span>
    `;
    fileList.appendChild(li);
  });
}

const decodeBtn = document.querySelector("#decode-btn");
const decodeInput = document.querySelector("#decode-password");
const decodedTextElm = document.querySelector("#decoded-text");

decodeBtn.addEventListener("click", async () => {
  if(fileInput.files.length === 0) return;
  const password = decodeInput.value;
  
  const { data, salt } = JSON.parse(await fileInput.files[0].text());
  
  const { key } = await generateKey(password, Uint8Array.fromBase64(salt));
  const decodedText = await decrypt(Uint8Array.fromBase64(data), key);
  decodedTextElm.innerHTML = decodedText;
  
  
  
  document.querySelector("#space").style.display = "block";
  
})

function copyTextToClipboard(text) {
  navigator.clipboard.writeText(text)
    .then(() => {
      //console.log('Text successfully copied to clipboard');
    })
    .catch(err => {
      console.error('Failed to copy text: ', err);
    });
}


document.querySelector("#raw-copy").addEventListener("click", () => {
  copyTextToClipboard(decodedTextElm.innerHTML);
});


document.querySelector("#copy").addEventListener("click", () => {
  copyTextToClipboard(decodedTextElm.innerText);
})



</script>
</body>
</html>
