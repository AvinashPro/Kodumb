<script>

function regCPolyNRXYDeg(n, r = 30, x = 0, y = 0, Deg = 0) {
  const verts = [];
  
  const rad = Deg * Math.PI / 180;
  const cos = Math.cos(rad);
  const sin = Math.sin(rad);
  
  const u = 2 * Math.PI / n;
  for(let i = 0; i < n; i++) {
    const x1 = r * Math.cos(i * u);
    const y1 = r * Math.sin(i * u);
    verts.push([
      x1 * cos - y1 * sin + x,
      x1 * sin + y1 * cos + y
    ]);
  }
  return verts;
}

function vertsText(verts) {
  let points = "";
  for(const vert of verts) {
    points += `${Math.round(vert[0])},${Math.round(vert[1])} `;
  }
  return points;
}

console.log(vertsText(regCPolyNRXYDeg(8, 50, 250, 300, 0)));


</script>
