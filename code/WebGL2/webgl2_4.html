<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>WebGL2 - 4</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      max-height: 100vh;
      height: 100vh;
      overflow-y: hidden;
      display: grid;
      place-items: center;
      background: rgb(10, 20, 40);
    }
  </style>
</head>
<body>
  <canvas></canvas>
<script>
  const canvas = document.querySelector("canvas");
  const gl = canvas.getContext("webgl2");
  function resizeCanvas(w = window.innerWidth, h = window.innerHeight) {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.onresize = () => {
    resizeCanvas();
    render(gl);
  }
  resizeCanvas();
  
  
  
  
  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    
    if(!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const info = gl.getShaderInfoLog(shader);
      gl.deleteShader(shader);
      throw new Error(info);
    }
    
    return shader;
  }
  
  function createProgram(gl, vs, fs) {
    const program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);
    
    if(!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      const info = gl.getProgramInfoLog(program);
      gl.deleteProgram(program);
      throw new Error(info);
    }
    
    return program;
  }
  

const vs1 =
`#version 300 es

in vec2 a_position;
in vec4 a_color;
out vec4 color;
void main() {
  gl_Position = vec4(a_position, 0, 1);
  color = a_color;
}
`;

  const fs1 = 
`#version 300 es

precision mediump float;
in vec4 color;
out vec4 v_color;
void main() {
  v_color = color;
}
`;

  // -1 to -8 are meaningless data
  const triangles = new Float32Array([
    -0.5, 0.5, -1, -2, 0.3, 0.7, 0.9, 1.0,
    0.5, 0.5, -3, -4, 1.0, 1.0, 1.0, 1.0,
    0.5, -0.5, -5, -6, 0.0, 0.5, 1.0, 1.0,
    -0.5, -0.5, -7, -8, 0.0, 0.7, 0.9, 1.0
  ]);
  
  const vs = createShader(gl, gl.VERTEX_SHADER, vs1);
  const fs = createShader(gl, gl.FRAGMENT_SHADER, fs1);
  const program = createProgram(gl, vs, fs);
  
  gl.useProgram(program);
  
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, triangles, gl.STATIC_DRAW);
  
  const a_pos_location = gl.getAttribLocation(program, "a_position");
  const a_color_location = gl.getAttribLocation(program, "a_color");
  
  gl.enableVertexAttribArray(a_pos_location);
  gl.enableVertexAttribArray(a_color_location);
  
  gl.vertexAttribPointer(a_pos_location, 2, gl.FLOAT, false, 32, 0);
  gl.vertexAttribPointer(a_color_location, 4, gl.FLOAT, false, 32, 16);
  
  const indices = new Uint16Array([
    0, 1, 2,
    0, 2, 3
  ]);
  const indexBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);
  
  gl.bindVertexArray(null);
  
  function render(gl) {
    gl.bindVertexArray(vao);
    gl.clearColor(0.05, 0.1, 0.2, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
  }
  
  render(gl);
  
  
  
  
</script>
</body>
</html>
