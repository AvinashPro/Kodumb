<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>WebGL2 - 2</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: rgb(10, 20, 30);
      max-height: 100vh;
      overflow-y: hidden;
    }
    
    /*canvas {
      image-rendering: pixelated;
    }*/
    
  </style>
</head>
<body>
  <canvas></canvas>
<script>
  const canvas = document.querySelector("canvas");
  const gl = canvas.getContext("webgl2");
  const dpr = window.devicePixelRatio || 1;
  
  function resizeCanvas(w = window.innerWidth, h = window.innerHeight) {
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener("resize", () => {
    resizeCanvas();
  })
  resizeCanvas();
  
  
  
  function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    
    if(!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const info = gl.getShaderInfoLog(shader);
      gl.deleteShader(shader);
      throw new Error(info);
    }
    
    return shader;
  }
  
  function createProgram(gl, vs, fs) {
    const program = gl.createProgram();
    gl.attachShader(program, vs);
    gl.attachShader(program, fs);
    gl.linkProgram(program);
    
    if(!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      const info = gl.getProgramInfoLog(program);
      gl.deleteProgram(program);
      throw new Error(info);
    }
    
    return program;
  }
  
  
  const vs1_source =
`#version 300 es

in vec2 pos;
in vec4 inpColor;
out vec4 color;
void main() {
 gl_Position = vec4(pos, 0, 1);
 color = inpColor;
}
`;

  const fs1_source =
`#version 300 es

precision mediump float;
in vec4 color;
out vec4 finalColor;
void main() {
  finalColor = color;
}
`;
  
  
  const vs1 = createShader(gl, gl.VERTEX_SHADER, vs1_source);
  const fs1 = createShader(gl, gl.FRAGMENT_SHADER, fs1_source);
  const program1 = createProgram(gl, vs1, fs1);
  
  gl.useProgram(program1);
  
  const verticesData = new Float32Array([
    -0.4, -0.2, 0.9, 0.9, 0.9, 1.0,
    -0.4, 0.7, 0.0, 0.8, 0.4, 1.0,
    0.8, 0.2, 0.0, 0.8, 1.0, 1.0,
    0.05, -0.5, 1.0, 0.0, 0.0, 1.0,
    0.3, -0.8, 0.0, 1.0, 0.0, 1.0,
    -0.2, -0.8, 0.0, 0.0, 1.0, 1.0
  ]);
  
  
  const vertBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vertBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, verticesData, gl.STATIC_DRAW);
  
  
  const FSIZE = Float32Array.BYTES_PER_ELEMENT;
  
  
  const posLocation = gl.getAttribLocation(program1, "pos");
  gl.enableVertexAttribArray(posLocation);
  gl.vertexAttribPointer(posLocation, 2, gl.FLOAT, false, 6 * FSIZE, 0);
  
  const colLocation = gl.getAttribLocation(program1, "inpColor");
  gl.enableVertexAttribArray(colLocation);
  gl.vertexAttribPointer(colLocation, 4, gl.FLOAT, false, 6 * FSIZE, 2 * FSIZE);
  
  
  
  gl.clearColor(0.0, 0.05, 0.1, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES, 0, 6);
  
</script>
</body>
</html>
