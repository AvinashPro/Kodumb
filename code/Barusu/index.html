<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title></title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: rgb(4,13,30);
    }
    canvas {
      box-shadow: 0 0 20px rgba(83,141,251,0.05);
    }
    p {
      background: -webkit-linear-gradient(30deg, #bdf6ff, #f7feff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 20px;
      margin-bottom: 10px;
      transform: scaleY(1.1);
      opacity: 0.01;
    }
    
    .container {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div>
      <p>Riguma Barusu</p>
      <canvas></canvas>
    </div>
  </div>
<script>
  const canvas = document.querySelector("canvas");
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  let [w, h] = [window.innerWidth, 9 / 16 * window.innerWidth];
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  
  
  class Vector {
  
  constructor(x = 0, y = 0) {
    this.x = x;
    this.y = y;
  }
  
  static zero() {
    return new Vector();
  }
  
  static one() {
    return new Vector(1, 1);
  }
  
  static from(v) {
    return new Vector(v.x, v.y);
  }
  
  static fromAngle(a) {
    return new Vector(Math.cos(a), Math.sin(a));
  }
  
  clone() {
    return new Vector(this.x, this.y);
  }
  
  add(v) {
    this.x += v.x;
    this.y += v.y;
    return this;
  }
  
  sub(v) {
    this.x -= v.x;
    this.y -= v.y;
    return this;
  }
  
  scale(k) {
    this.x *= k;
    this.y *= k;
    return this;
  }
  
  mult(x, y = 1) {
    this.x *= x;
    this.y *= y;
    return this;
  }
  
  div(x, y = 1) {
    this.x /= x;
    this.y /= y;
    return this;
  }
  
  normalize() {
    const len = this.length();
    if(len == 0) {
      this.set(1, 0);
      return this;
    }
    this.scale(1 / len);
    return this;
  }
  
  length() {
    return Math.hypot(this.x, this.y);
  }
  
  lengthSq() {
    return this.x * this.x + this.y * this.y;
  }
  
  negate() {
    this.scale(-1);
    return this;
  }
  
  set(x, y) {
    this.x = x;
    this.y = y;
    return this;
  }
  
  copy(v) {
    this.x = v.x;
    this.y = v.y;
    return this;
  }
  
  equals(v, e = 0) {
    return Math.abs(this.x - v.x) <= e && Math.abs(this.y - v.y) <= e;
  }
  
  dot(v) {
    return this.x * v.x + this.y * v.y;
  }
  
  cross(v) {
    return this.x * v.y - this.y * v.x;
  }
  
  rotate(a) {
    let sin = Math.sin(a),
        cos = Math.cos(a),
        x = this.x,
        y = this.y;
    
    this.x = x * cos - y * sin;
    this.y = x * sin + y * cos;
    return this;
  }
  
  angle() {
    return Math.acos(
        this.x / this.length()
      );
  }
  
  
  lerp(v, k) {
    this.x += (v.x - this.x) * k;
    this.y += (v.y - this.y) * k;
    return this;
  }

  normal() {
    return new Vector(this.y, -this.x).normalize();
  }
  
  
}
  
  
  class Circle {
    static _ID = 0;
    constructor(params = {}) {
      this.id = Circle._ID++;
      this.pos = new Vector(params.x ?? 0, params.y ?? 0);
      this.vel = new Vector();
      this.r = params.r ?? 10;
      //this.col = params.col || "rgb(191,214,255,0.2)";
      this.col = params.col || "rgb(205,255,250,0.2)";
    }
    
    render(ctx) {
      ctx.beginPath();
      ctx.fillStyle = this.col;
      ctx.arc(this.pos.x, this.pos.y, this.r, 0, 2*Math.PI);
      ctx.fill();
    }
    
    update(dt) {
      this.pos.add(this.vel.clone().scale(dt));
    }
    
  }
  
  const entities = [];
  let ZOOM = 1;
  let z = ZOOM * dpr;
  const RADIUS = 2;
  const GAP = 5;
  const ROWS = canvas.clientHeight / (2 * RADIUS + GAP), COLUMNS = canvas.clientWidth / (2 * RADIUS + GAP);
  for(let r = 0; r < ROWS; r++) {
    for(let c = 0; c < COLUMNS; c++) {
      entities.push(new Circle({
        x: c * (2 * RADIUS + GAP) + RADIUS, y: r * (2 * RADIUS + GAP) + RADIUS, r: 0.5
      }));
    }
  }
  
  
  const balls = [];
  const ball1 = new Circle({
    x: 10, y: 15, r: 90, col: "rgba(255,255,255,0.0)"
  });
  const ball2 = new Circle({
    x: 100, y: 150, r: 80, col: "rgba(255,255,255,0.0)"
  });
  const ball3 = new Circle({
    x: 200, y: 100, r: 50, col: "rgba(255,255,255,0.0)"
  });
  ball1.vel.set(25, 10).scale(10);
  ball2.vel.set(20, -10).scale(10);
  ball3.vel.set(20, 10).scale(15);
  ball1.ball = ball2.ball = ball3.ball = true;
  entities.push(ball1, ball2, ball3);
  balls.push(ball1, ball2, ball3);
  
  let then = 0, now, dt;
  function loop() {
    requestAnimationFrame(loop);
    ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
    
    now = performance.now();
    dt = (now - then) * 0.001;
    then = now;
    
    
    ctx.setTransform(z, 0, 0, z, 0, 0);
    for(const b of balls) {
      if(b.pos.x > canvas.clientWidth || b.pos.x < - b.r) {
        b.vel.x *= -1;
      } else if(b.pos.y < - b.r || b.pos.y > canvas.clientHeight) {
        b.vel.y *= -1;
      }
    }
    for(const e of entities) {
      e.update(dt);
      
      for(const b of balls) {
        
        if(e.ball || (e.id === b.id)) continue;
        const distSq = e.pos.clone().sub(b.pos).lengthSq();
        if(distSq < e.r * e.r + b.r * b.r) {
          
          e.r += Math.max(0, Math.min((b.r - Math.sqrt(distSq)) * 0.001, 0.5));
          
        }
      }
      
      if(!e.ball) {
        e.r -= 2 * dt;
        e.r = Math.max(0.5, Math.min(e.r, RADIUS));
      }
      
      e.render(ctx);
      
    }
    
    
    
    
  }
  
  loop();
  
  
</script>
</body>
</html>
