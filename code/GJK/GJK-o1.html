<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>GJK</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: rgb(10,20,30);
    }
    #infoElm {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #09f;
      mix-blend-mode: difference;
      /*background: rgb(10,20,30);*/
    }
    canvas {
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas></canvas>
  <p id="infoElm"></p>
<script>


const canvas = document.querySelector("canvas");
const ctx = canvas.getContext("2d");
function setCanvasSize(w = window.innerWidth, h = window.innerHeight) {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
};
window.addEventListener("resize", () => { setCanvasSize(); });
setCanvasSize();


class vec3 {
  static count = 0;
  constructor(x = 0, y = 0, z = 0) {
    this.x = x;
    this.y = y;
    this.z = z;
    vec3.count++;
  }
  add(v) {
    this.x += v.x;
    this.y += v.y;
    this.z += v.z;
    return this;
  }
  sub(v) {
    this.x -= v.x;
    this.y -= v.y;
    this.z -= v.z;
    return this;
  }
  scale(k) {
    this.x *= k;
    this.y *= k;
    this.z *= k;
    return this;
  }
  clone() {
    return new vec3(this.x, this.y, this.z);
  }
  static from(v) {
    return new vec3(v.x, v.y, v.z);
  }
  copy(v) {
    this.x = v.x;
    this.y = v.y;
    this.z = v.z;
    return this;
  }
  set(x, y, z = null) {
    this.x = x;
    this.y = y;
    this.z = z ?? this.z;
    return this;
  }
  dot(v) {
    return this.x * v.x + this.y * v.y + this.z * v.z;
  }
  cross(v, d = new vec3()) {
    d.x = this.y * v.z - v.y * this.z;
    d.y = - this.x * v.z + v.x * this.z;
    d.z = this.x * v.y - v.x * this.y;
    return d;
  }
  rotateZ(angle, v = this) {
    const sin = Math.sin(angle);
    const cos = Math.cos(angle);
    const { x, y } = this;
    v.x = x * cos - y * sin;
    v.y = x * sin + y * cos;
    return v;
  }
  rotateZ2(sin, cos, v = this) {
    const { x, y } = this;
    v.x = x * cos - y * sin;
    v.y = x * sin + y * cos;
    return v;
  }
  lengthSq() {
    return this.x * this.x + this.y * this.y + this.z * this.z;
  }
  length() {
    return Math.sqrt(this.x * this.x + this.y * this.y + this.z * this.z);
  }
  normalize() {
    const len = this.length();
    if(len !== 0) return this.scale(1 / len);
    return this.set(1, 0, 0);
  }
  lerp(v, t = 0.05) {
    this.x += (v.x - this.x) * t;
    this.y += (v.y - this.y) * t;
    this.z += (v.z - this.z) * t;
    return this;
  }
}

class VectorPool {
  constructor(size = 20) {
    this.size = size;
    this.pool = [];
    for(let i = 0; i < size; i++) {
      this.pool.push(new vec3());
    }
  }
  
  get(vec = null) {
    if(this.size === 0) return vec ? vec3.from(vec) : new vec3();
    const v = this.pool[--this.size];
    return vec ? v.copy(vec) : v;
  }
  
  add() {
    for(let i = 0; i < arguments.length; i++) {
      this.pool[this.size++] = arguments[i];
    }
  }
}
const vp = new VectorPool(20);

class Body {
  static _id = 0;
  constructor(params = {}) {
    this.pos = new vec3(params.x ?? 0, params.y ?? 0, params.z ?? 0);
    this.angle = params.angle ?? 0;
    this.angVel = params.angVel ?? 0;
    this.color = params.color || "#09f";
  }
  computeWorldVertices() { }
  render() { }
  update(dt) {
    this.sinCache = Math.sin(this.angle);
    this.cosCache = Math.cos(this.angle);
    this.angle += this.angVel * dt;
    this.computeWorldVertices();
  }
}

class Polygon extends Body {
  
  constructor(vertices, params = {}) {
    super(params);
    this.id = Body._id++;
    this.vertices = vertices;
    this.worldVertices = [];
    for(let i = 0; i < this.vertices.length; i++) {
      this.worldVertices.push(new vec3());
    };
  }
  
  computeWorldVertices() {
    for(let idx = 0; idx < this.worldVertices.length; idx++) {
      this.vertices[idx].rotateZ2(this.sinCache, this.cosCache, this.worldVertices[idx]).add(this.pos);
    }
    return this.worldVertices;
  }
  
  render(ctx) {
    ctx.beginPath();
    ctx.strokeStyle = this.color;
    ctx.moveTo(0, 0);
    for(const vertex of this.vertices) {
      ctx.lineTo(vertex.x, vertex.y)
    }
    ctx.lineTo(this.vertices[0].x, this.vertices[0].y);
    ctx.stroke();
    ctx.closePath();
  }
  
  findFurthestPointInADirection(d, destination = new vec3()) {
    let dotVal = -Infinity;
    for(let idx = 0; idx < this.worldVertices.length; idx++) {
      const dot = this.worldVertices[idx].dot(d);
      if(dot > dotVal) {
        destination.copy(this.worldVertices[idx]);
        dotVal = dot;
      }
    }
    return destination;
  }
  
}
class Circle extends Body {
  
  constructor(params = {}) {
    super(params);
    this.id = Body._id++;
    this.r = params.r ?? 10;
  }
  
  render(ctx) {
    ctx.beginPath();
    ctx.strokeStyle = this.color;
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, this.r, 0, 2 * Math.PI);
    ctx.stroke();
    ctx.closePath();
  }
  
  findFurthestPointInADirection(d, destination = new vec3()) {
    const v = vp.get(d);
    destination.copy(this.pos).add(v.normalize().scale(this.r));
    vp.add(v);
    return destination;
  }
  
}





class GJK {
  constructor() { }
  
  static dir = new vec3();
  static p1 = new vec3();
  static p2 = new vec3();
  static simplex = [new vec3(), new vec3(), new vec3(), new vec3()];
  static simplexLength = 0;
  
  static support(shapeA, shapeB, direction) {
    const dir = vp.get(direction);
    GJK.p1.set(0, 0, 0);
    GJK.p2.set(0, 0, 0);
    shapeA.findFurthestPointInADirection(dir, GJK.p1);
    shapeB.findFurthestPointInADirection(dir.scale(-1), GJK.p2);
    vp.add(dir);
    return GJK.p1.sub(GJK.p2);
  }
  
  static pushToSimplex(point) {
    //if(GJK.simplexLength >= 4) return;
    GJK.simplex[GJK.simplexLength].copy(point);
    GJK.simplexLength++;
  }
  
  static removeLastAddedFromSimplex() {
    //GJK.simplex[GJK.simplexLength - 1].set(0, 0, 0);
    GJK.simplexLength--;
  }
  
  static check(shapeA, shapeB) {
    GJK.dir.set(1, 0, 0);
    GJK.simplexLength = 0;
    const support = GJK.support(shapeA, shapeB, GJK.dir);
    GJK.pushToSimplex(support);
    GJK.dir.copy(support.scale(-1));
    
    let iterations = 0;
    while(iterations < 100) {
      iterations++;
      support.copy(GJK.support(shapeA, shapeB, GJK.dir));
      if(support.dot(GJK.dir) <= 0) return false;
      GJK.pushToSimplex(support);
      if(GJK.NextSimplex()) return true;
    }
    
  }
  
  static NextSimplex() {
    switch (GJK.simplexLength) {
      case 2: return GJK.Line();
      case 3: return GJK.Triangle();
      case 4: return GJK.Tetrahedron();
    }
    return false;
  }
  
  static sameDirection(v1, v2) {
    return v1.dot(v2) > 0;
  }
  
  static Line() {
    const a = GJK.simplex[1];
    const b = GJK.simplex[0];
    
    const ab = vp.get(b).sub(a);
    const ao = vp.get(a).scale(-1);
    const vp1 = vp.get();
    if(GJK.sameDirection(ab, ao)) {
      ab.cross(ao, vp1).cross(ab, GJK.dir);
    } else {
      GJK.simplex[0].copy(a);
      GJK.simplexLength = 1;
      GJK.dir.copy(ao);
    }
    vp.add(ab, ao, vp1);
    return false;
  }
  
  static Triangle() {
    const a = GJK.simplex[2];
    const b = GJK.simplex[1];
    const c = GJK.simplex[0];
    
    const vp1 = vp.get();
    const vp2 = vp.get();
    const vp3 = vp.get();
    const vp4 = vp.get();
    
    const ab = vp.get(b).sub(a);
    const ac = vp.get(c).sub(a);
    const ao = vp.get(a).scale(-1);
    const abc = ab.cross(ac, vp1);
    const abPerp = ab.cross(abc, vp2);
    const acPerp = abc.cross(ac, vp3);
    if(GJK.sameDirection(acPerp, ao)) {
      if(GJK.sameDirection(ac, ao)) {
        GJK.simplex[0].copy(c);
        GJK.simplex[1].copy(a);
        GJK.simplexLength = 2;
        ac.cross(ao, vp4).cross(ac, GJK.dir);
        vp.add(ab, ac, ao, vp1, vp2, vp3, vp4);
      } else {
        GJK.simplex[0].copy(b);
        GJK.simplex[1].copy(a);
        GJK.simplexLength = 2;
        vp.add(ab, ac, ao, vp1, vp2, vp3, vp4);
        return GJK.Line();
      }
    } else if(GJK.sameDirection(abPerp, ao)) {
      GJK.simplex[0].copy(b);
      GJK.simplex[1].copy(a);
      GJK.simplexLength = 2;
      vp.add(ab, ac, ao, vp1, vp2, vp3, vp4);
      return GJK.Line();
    } else {
      vp.add(ab, ac, ao, vp1, vp2, vp3, vp4);
      return true;
    }
    return false;
  }
  
  static Tetrahedron() {
    const a = GJK.simplex[3];
    const b = GJK.simplex[2];
    const c = GJK.simplex[1];
    const d = GJK.simplex[0];
    
    const vp1 = vp.get();
    const vp2 = vp.get();
    const vp3 = vp.get();
    
    const ab = vp.get(b).sub(a);
    const ac = vp.get(c).sub(a);
    const ad = vp.get(d).sub(a);
    const ao = vp.get(a).scale(-1);
    const abc = ab.cross(ac, vp1);
    const acd = ac.cross(ad, vp2);
    const adb = ad.cross(ab, vp3);
    
    if(GJK.sameDirection(abc, ao)) {
      GJK.simplex[0].copy(c);
      GJK.simplex[1].copy(b);
      GJK.simplex[2].copy(a);
      GJK.simplexLength = 3;
      vp.add(ab, ac, ad, ao, vp1, vp2, vp3);
      return GJK.Triangle();
    }
    
    if(GJK.sameDirection(acd, ao)) {
      GJK.simplex[0].copy(d);
      GJK.simplex[1].copy(c);
      GJK.simplex[2].copy(a);
      GJK.simplexLength = 3;
      vp.add(ab, ac, ad, ao, vp1, vp2, vp3);
      return GJK.Triangle();
    }
    
    if(GJK.sameDirection(adb, ao)) {
      GJK.simplex[0].copy(b);
      GJK.simplex[1].copy(d);
      GJK.simplex[2].copy(a);
      GJK.simplexLength = 3;
      vp.add(ab, ac, ad, ao, vp1, vp2, vp3);
      return GJK.Triangle();
    }
    
    vp.add(ab, ac, ad, ao, vp1, vp2, vp3);
    return true;
    
  }
  
}





function generateRegularPolyVertices(n, r = 30) {
  const vertices = [];
  const t = Math.PI * 2 / n;
  for(let i = 0; i < n; i++) {
    vertices.push(new vec3(Math.cos(i * t) * r, Math.sin(i * t) * r));
  }
  return vertices;
}
function randint(min, max) {
  return Math.floor((max + 1 - min) * Math.random()) + Math.floor(min);
}

const entities = [];
let ZOOM = 1;
let z = ZOOM * (window.devicePixelRatio || 1);

for(let i = 0; i < 100; i++) {
  const x = randint(0, canvas.clientWidth);
  const y = randint(50, canvas.clientHeight);
  const angVel = randint(-1, 1);
  let e;
  if(Math.random() < 0.5) {
    e = new Polygon(generateRegularPolyVertices(randint(3, 7), randint(5, 20)),
      { x, y, angVel });
  } else {
    e = new Circle({
      x, y, angVel,
      r: randint(5, 20)
    });
  }
  entities.push(e);
}


let t0 = performance.now();
let t1 = t0, frames = 0, fps;
const infoElm = document.querySelector("#infoElm");
const mouse = vec3.from(entities[0].pos);
let gjkChecks = 0;
function loop(t) {
  requestAnimationFrame(loop);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  z = ZOOM * (window.devicePixelRatio || 1);
  ctx.setTransform(z, 0, 0, z, 0, 0);
  dt = (t - t0) * 0.001;
  t0 = t;
  frames++;
  if(t - t1 >= 1000) {
    fps = frames;
    t1 = t;
    infoElm.textContent = `FPS: ${fps} | Allocated vec3: ${vec3.count} | GJK checks: ${gjkChecks}`;
    frames = 0;
  }
  
  gjkChecks = 0;
  entities[0].pos.lerp(mouse);

  for(const e of entities) {
    e.color = "#09f";
    e.update(dt);
  }
  
  for(const e of entities) {
    
    for(const f of entities) {
      if(e.id >= f.id) continue;
      gjkChecks++;
      if(GJK.check(e, f)) {
        e.color = "#fff";
        f.color = "#fff";
      }
    }
    
    
    ctx.setTransform(e.cosCache * z, e.sinCache * z, - e.sinCache * z, e.cosCache * z, e.pos.x * z, e.pos.y * z);
    e.render(ctx);
  }
  
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  
}
requestAnimationFrame(loop);


window.addEventListener("pointerdown", e => {
  mouse.set(e.clientX, e.clientY);
})
window.addEventListener("pointermove", e => {
  mouse.set(e.clientX, e.clientY);
})
infoElm.addEventListener("dblclick", () => {
  try {
    document.documentElement.requestFullscreen();
  } catch(e) { }
})

</script>
</body>
</html>
