<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title> 
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
    overscroll-behavior-y: none;
    }
    body {
      width: 100vw;
      height: 100vh;
      background: rgb(2,5,13);
      display: grid;
      place-items: center;
    }
    #fps {
      position: absolute;
      top: 10px;
      left: 10px;
      font-family: Sans-Serif;
      color: rgb(126,156,238);
    }
  </style>
</head>
<body>
  <canvas>
    
  </canvas>
  <div id="fps">90</div>
<script>
  
const canvas = document.querySelector("canvas");
const ctx = canvas.getContext("2d");
const dpr = window.devicePixelRatio || 1;
const w = innerWidth;
const h = innerHeight;

canvas.width = w*dpr;
canvas.height = h*dpr;
canvas.style.width = w+"px"
canvas.style.height = h+"px"
ctx.scale(dpr, dpr)

let W = canvas.clientWidth;
let H = canvas.clientHeight;

class Vector {
  constructor(x = 0, y = 0) {
    this.x = x;
    this.y = y;
  }
  add(v) {
    return new Vector(this.x + v.x, this.y + v.y);
  }
  sub(v) {
    return new Vector(this.x - v.x, this.y - v.y);
  }
  mult(k) {
    return new Vector(this.x * k, this.y * k);
  }
  unit() {
    return this.mult(1/this.mag());
  }
  mag() {
    return Math.hypot(this.x, this.y);
  }
  rotate(angle) {
    return new Vector(this.x * Math.cos(angle) - this.y * Math.sin(angle), this.x * Math.sin(angle) + this.y * Math.cos(angle));
  }
  lerp(v, k) {
    return this.add(v.sub(this).mult(k));
  }
  normal() {
    return new Vector(- this.y, this.x);
  }
  static dot(a, b) {
    return a.x * b.x + a.y * b.y;
  }
}

let ID = 0;
class Polygon {
  constructor(isStatic, n, r, x = 0, y = 0, color = "#ffffff") {
    this.static = isStatic;
    this.id = ID++;
    this.n = n;
    this.r = r;
    this.pos = new Vector(x, y);
    this.color = color;
    this.vertices = [];
    this.axes = [];
    this.angle = 0;
    this.vel = new Vector(0, 0)
  }
  
  init() {
    this.updateVertices();
    this.updateAxes();
  }
  
  updateAxes() {
    this.axes = [];
    for(let idx = 0; idx < this.vertices.length; idx++) {
      const current = this.vertices[idx];
      const next = this.vertices[(idx + 1) % this.vertices.length]
      this.axes.push(next.sub(current).unit().normal());
    }
  }
  
  updateVertices() {
    this.vertices = [];
    for(let i = 0; i < this.n; i++) {
      let angle = i * 2 * Math.PI / this.n;
      
      
      let v = new Vector(Math.cos(angle) * this.r, Math.sin(angle) * this.r);
      v = v.rotate(- this.angle);
      v = v.add(this.pos);
      this.vertices.push(v);
    }
  }
  
  render(ctx) {
    ctx.beginPath();
    ctx.strokeStyle = this.color;
    ctx.moveTo(this.pos.x, this.pos.y);
    
    for(const vertex of this.vertices) {
      ctx.lineTo(vertex.x, vertex.y)
    }
    ctx.lineTo(this.vertices[0].x, this.vertices[0].y);
    ctx.stroke()
    ctx.closePath();
  }
  
  setPosition(x = 0, y = 0) {
    this.pos = this.pos.lerp(new Vector(x, y), 0.05);
    this.vertices = [];
    this.axes = [];
    this.init();
  }
  
  rotate(a) {
    this.angle += a * Math.PI / 180;
    this.updateVertices(a);
    this.updateAxes();
  }
  
  update() {
    this.vel = this.vel.mult(0.99)
    this.pos = this.pos.add(this.vel)
    this.updateVertices()
  }
  
}
class Rectangle {
  constructor(isStatic, w, h, x = 0, y = 0, color = "#ffffff") {
    this.static = isStatic;
    this.id = ID++;
    this.w = w;
    this.h = h;
    this.pos = new Vector(x, y);
    this.color = color;
    this.vertices = [];
    this.axes = [];
    this.angle = 0;
    this.vel = new Vector(0, 0);
    this.static = isStatic;
  }
  
  init() {
    this.updateVertices();
    this.updateAxes();
  }
  
  updateAxes() {
    this.axes = [];
    for(let idx = 0; idx < this.vertices.length; idx++) {
      const current = this.vertices[idx];
      const next = this.vertices[(idx + 1) % this.vertices.length]
      this.axes.push(next.sub(current).unit().normal());
    }
  }
  
  updateVertices() {
    this.vertices = [];
    this.vertices.push(
      new Vector(- this.w, - this.h) .rotate(- this.angle).add(this.pos),
      new Vector(this.w, - this.h).rotate(- this.angle).add(this.pos),
      new Vector(this.w, this.h).rotate(- this.angle).add(this.pos),
      new Vector(- this.w, this.h).rotate(- this.angle).add(this.pos)
      
    );

  }
  
  render(ctx) {
    ctx.beginPath();
    ctx.strokeStyle = this.color;
    ctx.moveTo(this.pos.x, this.pos.y);
    
    for(const vertex of this.vertices) {
      ctx.lineTo(vertex.x, vertex.y)
    }
    ctx.lineTo(this.vertices[0].x, this.vertices[0].y);
    ctx.stroke()
    ctx.closePath();
  }
  
  setPosition(x = 0, y = 0) {
    this.pos = this.pos.lerp(new Vector(x, y), 0.05);
    this.vertices = [];
    this.axes = [];
    this.init();
  }
  
  rotate(a) {
    this.angle += a * Math.PI / 180;
    this.updateVertices(a);
    this.updateAxes();
  }
  
  update() {
    //this.vel.y += 0.01;
    this.vel = this.vel.mult(0.99)
    this.pos = this.pos.add(this.vel)
    this.updateVertices()
  }
  
}

class Circle {
  constructor(isStatic, r, x, y, color = "rgb(255,255,255)") {
    this.r = r;
    this.static = isStatic;
    this.pos = new Vector(x, y);
    this.vel = new Vector();
    this.color = color;
  }
  getAxis(vertices) {
    let closestVertex = vertices[0], closestVertexDist = this.pos.sub(closestVertex).mag();
    for(const vertex of vertices) {
      let dist = this.pos.sub(vertex).mag();
      if(dist < closestVertexDist) {
        closestVertexDist = dist;
        closestVertex = vertex;
      }
    }
    let axis = closestVertex.sub(this.pos).unit();
    return [axis];
  }
  
  render(ctx) {
    ctx.beginPath();
    ctx.strokeStyle = this.color;
    ctx.moveTo(this.pos.x, this.pos.y)
    ctx.arc(this.pos.x, this.pos.y, this.r, 0, 2*Math.PI);
    ctx.stroke();
  }
  
  update() {
    this.vel = this.vel.mult(0.99);
    this.pos = this.pos.add(this.vel);
  }
  
}

function PolyVsPoly(p1, p2) {
  const axes = p1.axes.concat(p2.axes);
  let smallestOverlap = Infinity;
  let smallestAxis = null;
  for(const axis of axes) {
    
    let min1 = Vector.dot(p1.vertices[0], axis),
    max1 = Vector.dot(p1.vertices[0], axis),
    min2 = Vector.dot(p2.vertices[0], axis),
    max2 = Vector.dot(p2.vertices[0], axis);
    for(const v1 of p1.vertices) {
      
      let projection = Vector.dot(v1, axis);
      if(projection < min1) {
        min1 = projection;
      } else if(projection > max1) {
        max1 = projection;
      }
      
    }
    
    for(const v2 of p2.vertices) {
      
      let projection = Vector.dot(v2, axis);
      if(projection < min2) {
        min2 = projection;
      } else if(projection > max2) {
        max2 = projection;
      }
      
    }
    
    let overlap = Math.min(max1, max2) - Math.max(min1, min2);
    if(overlap < smallestOverlap) {
      smallestOverlap = overlap;
      smallestAxis = axis;
    }
    if (overlap <= 0) {
      return { colliding: false };
    }
    
    
  }
  
  const dir = p2.pos.sub(p1.pos);
  if(Vector.dot(dir, smallestAxis) < 0) {
    smallestAxis = smallestAxis.mult(-1);
  }
  
  const mtv = smallestAxis.mult(smallestOverlap);
  
  return { colliding: true, mtv: mtv };
  
}

function CircleVsPoly(cir, poly) {
  const axes = poly.axes.concat(cir.getAxis(poly.vertices));
  let smallestOverlap = Infinity;
  let smallestAxis = null;
  for(const axis of axes) {
    
    let min1 = Vector.dot(poly.vertices[0], axis),
    max1 = Vector.dot(poly.vertices[0], axis),
    min2 = null,
    max2 = null;
    for(const v1 of poly.vertices) {
      
      let projection = Vector.dot(v1, axis);
      if(projection < min1) {
        min1 = projection;
      } else if(projection > max1) {
        max1 = projection;
      }
      
    }
    
    
    let projection = Vector.dot(cir.pos, axis);
    min2 = projection - cir.r;
    max2 = projection + cir.r;
    
    
    
    let overlap = Math.min(max1, max2) - Math.max(min1, min2);
    if(overlap < smallestOverlap) {
      smallestOverlap = overlap;
      smallestAxis = axis;
    }
    if (overlap <= 0) {
      return { colliding: false };
    }
    
    
  }
  
  const dir = poly.pos.sub(cir.pos);
  if(Vector.dot(dir, smallestAxis) < 0) {
    smallestAxis = smallestAxis.mult(-1);
  }
  
  const mtv = smallestAxis.mult(smallestOverlap).mult(-1);
  
  return { colliding: true, mtv: mtv };
}

let then = now = frame = dt = lastTime = fps = 0

const entities = [];
function loop() {
  requestAnimationFrame(loop)
  ctx.clearRect(0, 0, canvas.width, canvas.height)
  
  now = performance.now();
  if(now - lastTime > 1000) {
    fps = frame;
    frame = 0;
    lastTime = now;
    document.querySelector("#fps").textContent = fps;
  } else {
    frame += 1
  }
  
  p1.rotate(0.1);
  p2.rotate(0.05);
  t1.rotate(0.15);
  t2.rotate(1);
  w3.rotate(1);
  
  
  for(const e1 of entities) {
    
    
    for(const e2 of entities) {
      
      if(e1.id <= e2.id) continue;
      let result = null;
      if(e1.constructor.name == "Circle" && e2.constructor.name == "Circle") {
        continue;
      } else if(e1.constructor.name == "Circle") {
        result = CircleVsPoly(e1, e2);
      } else if(e2.constructor.name == "Circle") {
        result = CircleVsPoly(e2, e1);
      } else {
        result = PolyVsPoly(e1, e2);
      }
      
      
      if(result.colliding) {
        
        if(e1.static || e2.static) {
          if(e1.static) {
            e2.pos = e2.pos.add(result.mtv);
            e2.vel = e2.vel.add(result.mtv.unit().mult(0.05));
          } else {
            e1.pos = e1.pos.sub(result.mtv);
            e1.vel = e1.vel.sub(result.mtv.unit().mult(0.05))
          }
        } else {
          e1.pos = e1.pos.sub(result.mtv.mult(1/2))
          e2.pos = e2.pos.add(result.mtv.mult(1/2))
          e1.vel = e1.vel.sub(result.mtv.unit().mult(0.05))
          e2.vel = e2.vel.add(result.mtv.unit().mult(0.05))
        }
        if(e1.updateVertices) e1.updateVertices()
        if(e2.updateVertices) e2.updateVertices()
        e1.color = "dodgerblue";
        e2.color = "dodgerblue";
      } else {
        e1.color = "rgb(187,185,187)";
        e1.color = "rgb(187,185,187)";
      }
      
    }
  }
  
  
  
  
  
  
  for(const e of entities) {
    if(!e.static) e.update();
    e.render(ctx);
  }
  
  
  
}


const p1 = new Polygon(false, 5, 60, 170, 250, "rgb(126,156,238)");
const p2 = new Polygon(false, 7, 80, 90, 100, "rgb(238,126,201)");
t1 = new Polygon(false, 3, 90, 230, 150);
t2 = new Polygon(false, 3, 30, 80, H - 150);
w1 = new Rectangle(true, W, 1, 0, H + 2);
w2 = new Rectangle(false, 20, 60, 280, 300);
w3 = new Rectangle(true, 40, 10, 250, 250);
c1 = new Circle(false, 30, 150, 350);


entities.push(p1, p2, t1, t2, w1, w2, w3, c1);


for(const e of entities) {
  if(e.init) e.init();
}


loop();


canvas.addEventListener("touchstart", e => {
  let p = e.touches[0];
  p1.setPosition(p.clientX, p.clientY);
})
canvas.addEventListener("touchmove", e => {
  let p = e.touches[0];
  p1.setPosition(p.clientX, p.clientY);
})
</script>
